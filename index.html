function startOnline(){if(!NET||!NET.host)return;const tm=G.mode==='team';if(tm&&new Set(LB.map(p=>p.team)).size<2){$('#nm').textContent='Team vs Team needs players on both teams (click a team badge).';return}
 const seed=Math.random()*1e9|0,slots=LB.map(p=>({L:p.look,team:tm?p.team:0}));NET.conns.forEach(c=>c.send({t:'start',G,slots,seed,you:c.sidx}));NET.me=0;buildNet(slots,seed,0)}
function buildNet(slots,seed,you){au();lastIn='';lastInT=0;G.mode=G.mode==='team'?'team':'coop';DUR=G.len*60;const tm=G.mode==='team',ks=tm?[...new Set(slots.map(s=>s.team))].sort():[0];
 KS=ks.map(tid=>mkK(tid,seed,slots.filter(s=>!tm||s.team===tid).map(s=>s.L)));MAPS_=slots.map(s=>({k:tm?ks.indexOf(s.team):0,pi:slots.filter(x=>!tm||x.team===s.team).indexOf(s)}));
 ME=MAPS_[you];V=KS[ME.k];SCR=KS.map(k=>[k.team,0]);PT=[];paused=false;phase='play';playUI()}

function joinRoom(code){code=String(code||'').toUpperCase().replace(/[^A-Z]/g,'');if(code.length!==4){$('#nm').textContent='Enter the 4-letter code.';return}au();$('#nm').textContent='Connecting…';
 const peer=new Peer();NET={host:false,peer,code,c:null,me:0};let ok=0;const tmo=setTimeout(()=>{if(!ok){leaveNet();goJoin('Timed out. Check the code, and that the host is still in the lobby.')}},12000);
 peer.on('error',e=>{clearTimeout(tmo);leaveNet();goJoin(e.type==='peer-unavailable'?'Room not found.':'Connection error: '+e.type)});
 peer.on('open',()=>{const c=peer.connect('kchaos-'+code,{reliable:true});NET.c=c;
  c.on('open',()=>{ok=1;clearTimeout(tmo);c.send({t:'hello',look:cfg.me});phase='lobby';const f=peer.connect('kchaos-'+code,{reliable:false,label:'fast'});NET.f=f;f.on('data',m=>guestMsg(m))});
  c.on('data',m=>guestMsg(m));c.on('close',()=>{if(NET&&phase!=='menu'){leaveNet();goJoin('The host left the room.')}})})}
function guestMsg(m){if(!m)return;
 if(m.t==='full'){leaveNet();goJoin('Room is full or already playing.')}
 else if(m.t==='lobby'){G=Object.assign({},GD,m.G);LB=m.pl;NET.me=m.you;if(phase!=='lobby'){phase='lobby';KS=[];V=null}lobbyUI()}
 else if(m.t==='start'){G=Object.assign({},GD,m.G);NET.me=m.you;buildNet(m.slots,m.seed,m.you)}
 else if(m.t==='snap'&&phase==='play'&&V)apply(m.d);
 else if(m.t==='end')showRes(m.r)}
function snap(K){const tl=[];K.tiles.forEach(row=>row.forEach(t=>{if(t.item||t.dirty||t.clean||t.prog||'PD'.includes(t.ch))tl.push([t.r,t.c,t.item,t.n,t.dirty,t.clean,+t.prog.toFixed(2)])}));
 return{t:+K.t.toFixed(2),s:K.score,o:K.orders,tl,sh:K.shake,sc:KS.map(k=>[k.team,k.score]),ev:K.ev,p:K.pl.map(p=>({x:+p.x.toFixed(2),y:+p.y.toFixed(2),fx:p.fx,fy:p.fy,i:p.item,mv:p.mv,w:p.wash,ph:+p.ph.toFixed(1),d:p.d,pts:p.pts}))}}
function apply(d){const K=V;if(d.t<=(K.lS||0))return;K.lS=d.t;K.t=d.t;K.score=d.s;K.orders=d.o||[];SCR=d.sc;K.shake=Math.max(K.shake,d.sh||0);
 K.tiles.forEach(row=>row.forEach(t=>{t.item=null;t.dirty=t.clean=t.prog=0}));
 (d.tl||[]).forEach(([r,c,it,n,di,cl,pr])=>{const t=K.tiles[r]&&K.tiles[r][c];if(t){t.item=it;t.n=n;t.dirty=di;t.clean=cl;t.prog=pr}});
 d.p.forEach((q,i)=>{const p=K.pl[i];if(!p)return;const mine=i===ME.pi,e=Math.hypot(q.x-p.x,q.y-p.y);
  if(p.tx===undefined||e>1){p.x=q.x;p.y=q.y}else if(mine&&(!p.mv||e>.5)){p.x+=(q.x-p.x)*.3;p.y+=(q.y-p.y)*.3}
  p.tx=q.x;p.ty=q.y;p.item=q.i;p.wash=q.w;p.d=q.d;p.pts=q.pts;if(!mine){p.fx=q.fx;p.fy=q.fy;p.mv=q.mv;p.ph=q.ph}});
 (d.ev||[]).forEach(e=>fx(K,e[0],e[1],e[2],e[3],e[4]));K.flash=0}
let lastIn='',lastInT=0;function sendIn(){if(!NET||NET.host||!NET.c)return;const m=readKeys()(0),k=JSON.stringify(m),now=performance.now();if(k!==lastIn||now-lastInT>120){lastIn=k;lastInT=now;try{(NET.f&&NET.f.open?NET.f:NET.c).send({t:'in',...m})}catch(e){}}}
